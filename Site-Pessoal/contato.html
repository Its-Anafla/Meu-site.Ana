<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Ana Flávia Peixoto</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f4ed;
            --accent-purple: #9b7ea9;
            --dark-purple: #523e5c;
            --text-main: #3d3d3d;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        nav {
            background-color: #fff;
            width: 100%;
            padding: 15px 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 14px;
            border: 1px solid #ccc;
            padding: 8px 24px;
            border-radius: 20px;
            transition: 0.3s;
        }
        nav a:hover, nav a.active {
            background-color: var(--accent-purple);
            color: white;
            border-color: var(--accent-purple);
        }
        .section-box {
            width: 90%;
            max-width: 850px;
            background: #fff;
            margin: 40px auto;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid #eaeaea;
        }
        h2.section-heading {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            color: var(--dark-purple);
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
        }
        .contact-box {
            text-align: center;
            padding: 20px 0;
        }
        .email-btn {
            display: inline-block;
            background-color: var(--dark-purple);
            color: #fff;
            text-decoration: none;
            padding: 14px 32px;
            font-weight: bold;
            border-radius: 25px;
            font-size: 16px;
            margin-top: 15px;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .email-btn:hover {
            background-color: var(--accent-purple);
            transform: translateY(-2px);
        }
        footer {
            text-align: center;
            padding: 30px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="sobre.html">About me</a>
        <a href="interesses.html">Interests</a>
        <a href="contato.html" class="active">Contact</a>
    </nav>

    <div class="section-box">
        <h2 class="section-heading">Contact</h2>
        <div class="contact-box">
            <p>Entre em contato comigo por e-mail para oportunidades, dúvidas ou parcerias:</p>
           <a class="email-btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=ana.peixoto@sou.unifal-mg.edu.br" target="_blank">✉️ Enviar E-mail</a>
        </div>
    </div>

    <footer>
        <p>© 2026 — Ana Flávia dos Santos Peixoto | Ciência da Computação (Unifal-MG)</p>
    </footer>

</body>
</html>
